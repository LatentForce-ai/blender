[package]
name = "app"
version = "0.1.0"
edition = "2024"
description = "Blender web migration: the single WASM module linking every ported module"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
blenkernel = { path = "../blenkernel" }
console_error_panic_hook = "0.1.7"
depsgraph = { path = "../depsgraph" }
render = { path = "../render" }
shading = { path = "../shading" }
wasm-bindgen = "0.2.129"

[profile.release]
opt-level = "s"
lto = true
