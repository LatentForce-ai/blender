<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>blenkernel WASM demo</title>
  <style>
    :root { --bg: #1d1d1d; --panel: #2b2b2b; --text: #e6e6e6; --muted: #9a9a9a; --accent: #e87d0d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 340px; gap: 12px; padding: 12px; height: 100vh; }
    canvas { width: 100%; height: 100%; background: #393939; border-radius: 6px; display: block; }
    aside { background: var(--panel); border-radius: 6px; padding: 12px; overflow: auto; }
    h1 { font-size: 15px; margin: 0 0 8px; color: var(--accent); }
    h2 { font-size: 12px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    pre { margin: 0; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
    label { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
    #error { color: #ff6b6b; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } canvas { height: 60vh; } }
  </style>
</head>
<body>
  <main>
    <canvas id="viewport"></canvas>
    <aside>
      <h1>blenkernel → Rust → WASM</h1>
      <div>Scene data lives in Rust; this page only reads buffers and draws a wireframe.</div>
      <h2>Controls</h2>
      <label><input type="checkbox" id="spin" checked> Spin the cube (object transform)</label>
      <label><input type="checkbox" id="wave"> Wave the grid (mesh positions)</label>
      <h2>Data-blocks</h2>
      <pre id="blocks"></pre>
      <h2>take_changes() this frame</h2>
      <pre id="changes"></pre>
      <pre id="error"></pre>
    </aside>
  </main>
  <script type="module" src="./demo.js"></script>
</body>
</html>
