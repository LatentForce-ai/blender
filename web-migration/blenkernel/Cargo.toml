[package]
name = "blenkernel"
version = "0.1.0"
edition = "2021"
description = "Thin Rust/WASM port of Blender's blenkernel data model (hackathon ticket HACK-1)"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
